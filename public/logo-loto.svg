<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 48" width="140" height="48" aria-hidden="true">
  <defs>
    <!-- Boule rouge (reflet sphérique) -->
    <radialGradient id="ballRed" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#feb2b2"/>
      <stop offset="70%" stop-color="#e53e3e"/>
      <stop offset="100%" stop-color="#c53030"/>
    </radialGradient>
    <!-- Boule bleue -->
    <radialGradient id="ballBlue" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#90cdf4"/>
      <stop offset="70%" stop-color="#3182ce"/>
      <stop offset="100%" stop-color="#2b6cb0"/>
    </radialGradient>
    <!-- Boule jaune -->
    <radialGradient id="ballYellow" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#faf089"/>
      <stop offset="70%" stop-color="#d69e2e"/>
      <stop offset="100%" stop-color="#b7791f"/>
    </radialGradient>
    <!-- Ombre sous les boules -->
    <linearGradient id="shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Ombres -->
  <ellipse cx="28" cy="42" rx="14" ry="4" fill="url(#shadow)"/>
  <ellipse cx="70" cy="42" rx="14" ry="4" fill="url(#shadow)"/>
  <ellipse cx="112" cy="42" rx="14" ry="4" fill="url(#shadow)"/>
  <!-- Boule rouge -->
  <circle cx="28" cy="26" r="18" fill="url(#ballRed)" stroke="#c53030" stroke-width="0.6"/>
  <text x="28" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#fff">7</text>
  <!-- Boule bleue -->
  <circle cx="70" cy="26" r="18" fill="url(#ballBlue)" stroke="#2b6cb0" stroke-width="0.6"/>
  <text x="70" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#fff">12</text>
  <!-- Boule jaune -->
  <circle cx="112" cy="26" r="18" fill="url(#ballYellow)" stroke="#b7791f" stroke-width="0.6"/>
  <text x="112" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2d3748">5</text>
</svg>
